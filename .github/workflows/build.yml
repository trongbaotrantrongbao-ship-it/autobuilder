name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0

      - name: Resolve latest Yarn / Loader / Fabric API for 1.21.11
        run: |
          MC=1.21.11
          yarn=$(curl -s "https://meta.fabricmc.net/v2/versions/yarn/$MC" | jq -r '.[0].version')
          loader=$(curl -s "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[]|select(.stable)][0].version')
          fapi=$(curl -s "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number')
          echo "yarn=$yarn loader=$loader fabric-api=$fapi"
          sed -i "s|^yarn_mappings=.*|yarn_mappings=$yarn|; s|^loader_version=.*|loader_version=$loader|; s|^fabric_version=.*|fabric_version=$fapi|" gradle.properties
          cat gradle.properties

      - name: Download Litematica + MaLiLib (Fabric 1.21.11) from Modrinth
        run: |
          mkdir -p libs
          for slug in litematica malilib; do
            url=$(curl -s "https://api.modrinth.com/v2/project/$slug/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D" \
              | jq -r '.[0].files[] | select(.primary==true) | .url' | head -n1)
            echo "$slug -> $url"
            curl -sL "$url" -o "libs/$slug.jar"
          done
          ls -la libs

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: autobuilder-jar
          path: build/libs/*.jar

      - name: API dump (debug)
        if: always()
        continue-on-error: true
        run: |
          set +e
          echo "### fabric rendering jars"
          find ~/.gradle -name "fabric-rendering-v1*.jar" -not -name "*sources*" | head -3
          FJ=$(find ~/.gradle -name "fabric-rendering-v1*.jar" -not -name "*sources*" | head -1)
          unzip -l "$FJ" | grep -iE "WorldRender|world/" | awk '{print $4}' | head -40
          for c in $(unzip -l "$FJ" | awk '{print $4}' | grep -E "world/WorldRender(Events|Context|State)?\.class$|world/.*Events\.class$" | sed 's/\.class$//; s#/#.#g'); do echo "--- $c"; javap -public -cp "$FJ" "$c"; done
          echo "### minecraft jars"
          find ~/.gradle -path "*fabric-loom*" -name "*.jar" | grep -v sources | head -20
          MJ=$(find ~/.gradle -path "*minecraftMaven*" -name "*.jar" | grep -v sources | head -1)
          echo "MJ=$MJ"
          for c in net.minecraft.client.render.VertexRendering net.minecraft.client.gui.Click net.minecraft.client.input.KeyInput net.minecraft.client.render.RenderLayer; do echo "--- $c"; javap -public -cp "$MJ" "$c" | head -60; done
          echo "--- Screen mouse/key methods"
          javap -public -cp "$MJ" net.minecraft.client.gui.screen.Screen | grep -E "mouse|key|render|shouldPause|init\(|close"
          echo "--- DrawContext"
          javap -public -cp "$MJ" net.minecraft.client.gui.DrawContext | grep -E " fill| drawText| drawBorder| drawCenteredText| fillGradient"
          echo "--- KeyBinding"
          javap -public -cp "$MJ" net.minecraft.client.option.KeyBinding | grep -E "KeyBinding\(|Category|setPressed"

      - name: Publish jar to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" build/libs/autobuilder-*.jar \
            --title "AutoBuilder build ${{ github.run_number }}" \
            --notes "Jar tự build từ commit ${{ github.sha }}. Cần Fabric API + Litematica + MaLiLib (MC 1.21.11)."
